<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f4f6f9;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: white;
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 400px;
    }
    h1 {
      font-size: 60px;
      color: #2563eb;
      margin-bottom: 10px;
    }
    h2 {
      color: #1e293b;
      margin-bottom: 10px;
    }
    p {
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }
    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 25px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <a href="/login">Go to Login</a>
  </div>
</body>
</html>
